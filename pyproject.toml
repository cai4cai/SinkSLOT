[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name for this repo (SinkSLOT). It packages two things: the
# vendored flash_sinkhorn library below (third-party prior work, MIT-licensed,
# kept under its own name/attribution per the license) and this paper's own
# contribution (torch-ext/sinkslot/, gradient_flow/, configs/), which is
# anonymous for review. `authors` below names only the former -- it is not a
# claim about who wrote the latter.
name = "sinkslot"
dynamic = ["version"]
description = "SinkSLOT: sparse Sinkhorn over a sliced-OT reference plan in PyTorch + Triton, built on the vendored FlashSinkhorn kernels below."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["optimal-transport", "sinkhorn", "triton", "pytorch", "gpu"]
authors = [
  {name = "OT Triton Contributors"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = [
  "numpy",
  "torch>=2.5",
  "triton>=3.1",
]

[project.urls]
Homepage = "https://github.com/ot-triton-lab/flash-sinkhorn"
Repository = "https://github.com/ot-triton-lab/flash-sinkhorn"

[project.optional-dependencies]
dev = [
  "pytest",
  "geomloss",
  "pykeops",
  "jax",
  "ott-jax",
  "matplotlib",
  "pillow",
  "pot",
  "rich",
  "textual",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["torch-ext"]

[tool.setuptools.dynamic]
version = {attr = "flash_sinkhorn.__version__"}

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["torch-ext/flash_sinkhorn/testing"]
