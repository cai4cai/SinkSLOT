[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name for this repo (SinkSLOT). It packages two things under
# different attribution: the vendored flash_sinkhorn library (third-party
# prior work, MIT-licensed, kept under its own copyright and license -- see
# torch-ext/flash_sinkhorn/LICENSE, not repeated here) and this repo's own
# contribution (torch-ext/sinkslot/, gradient_flow/, configs/, the benchmark
# harness), whose author is listed below.
name = "sinkslot"
dynamic = ["version"]
description = "SinkSLOT: Sinkhorn via Sparse Lifted Optimal Transport -- a sparse Sinkhorn solver over a sliced-OT reference plan, in PyTorch + Triton."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
keywords = ["optimal-transport", "sliced-optimal-transport", "sparse-sinkhorn", "sinkhorn", "triton", "pytorch", "gpu"]
authors = [
  {name = "CAI4CAI research group", email = "contact@cai4cai.uk"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = [
  "numpy",
  "torch>=2.5",
  "triton>=3.1",
]

[project.urls]
Homepage = "https://github.com/cai4cai/SinkSLOT"
Repository = "https://github.com/cai4cai/SinkSLOT"
Issues = "https://github.com/cai4cai/SinkSLOT/issues"
UpstreamFlashSinkhorn = "https://github.com/ot-triton-lab/flash-sinkhorn"

[project.optional-dependencies]
dev = [
  "pytest",
  "geomloss",
  "pykeops",
  "jax",
  "ott-jax",
  "matplotlib",
  "pillow",
  "pot",
  "rich",
  "textual",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["torch-ext"]

[tool.setuptools.dynamic]
version = {attr = "flash_sinkhorn.__version__"}

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["torch-ext/flash_sinkhorn/testing", "torch-ext/sinkslot/testing"]
